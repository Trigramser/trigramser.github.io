<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>计算题生成器</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Microsoft YaHei", Arial, sans-serif;
      background: linear-gradient(135deg, #e0f2fe, #fef3c7);
      color: #1f2937;
      min-height: 100vh;
      padding: 24px;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
      background: #ffffff;
      border-radius: 20px;
      padding: 28px;
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.12);
    }

    h1 {
      text-align: center;
      margin-top: 0;
      color: #2563eb;
      font-size: 32px;
    }

    .subtitle {
      text-align: center;
      color: #6b7280;
      margin-bottom: 28px;
    }

    .settings {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 18px;
      margin-bottom: 24px;
      padding: 20px;
      background: #f9fafb;
      border-radius: 16px;
      border: 1px solid #e5e7eb;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    label {
      font-weight: 700;
      color: #374151;
    }

    input[type="number"] {
      padding: 11px 12px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      font-size: 16px;
      outline: none;
    }

    input[type="number"]:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
    }

    .checkbox-group {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .checkbox-card {
      display: flex;
      align-items: center;
      gap: 6px;
      background: #ffffff;
      border: 1px solid #d1d5db;
      padding: 10px 12px;
      border-radius: 10px;
      cursor: pointer;
      user-select: none;
      font-weight: 700;
    }

    .checkbox-card input {
      width: 18px;
      height: 18px;
      cursor: pointer;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
      margin-bottom: 24px;
    }

    button {
      border: none;
      border-radius: 999px;
      padding: 12px 22px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: 0.2s;
    }

    .btn-primary {
      background: #2563eb;
      color: #ffffff;
    }

    .btn-primary:hover {
      background: #1d4ed8;
      transform: translateY(-1px);
    }

    .btn-secondary {
      background: #10b981;
      color: #ffffff;
    }

    .btn-secondary:hover {
      background: #059669;
      transform: translateY(-1px);
    }

    .btn-warning {
      background: #f59e0b;
      color: #ffffff;
    }

    .btn-warning:hover {
      background: #d97706;
      transform: translateY(-1px);
    }

    .btn-gray {
      background: #6b7280;
      color: #ffffff;
    }

    .btn-gray:hover {
      background: #4b5563;
      transform: translateY(-1px);
    }

    .message {
      text-align: center;
      min-height: 28px;
      font-weight: 700;
      margin-bottom: 16px;
      line-height: 1.7;
    }

    .message.error {
      color: #dc2626;
    }

    .message.success {
      color: #059669;
    }

    .problems {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 14px;
    }

    .problem {
      display: grid;
      grid-template-columns: 36px 1fr 90px;
      align-items: center;
      gap: 10px;
      padding: 14px;
      border-radius: 14px;
      background: #f8fafc;
      border: 1px solid #e5e7eb;
    }

    .problem-number {
      font-weight: 700;
      color: #2563eb;
    }

    .expression {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 1px;
      white-space: nowrap;
    }

    .answer-input {
      width: 100%;
      padding: 8px 10px;
      border-radius: 8px;
      border: 1px solid #d1d5db;
      font-size: 16px;
      text-align: center;
    }

    .answer-input.correct {
      border-color: #10b981;
      background: #ecfdf5;
    }

    .answer-input.wrong {
      border-color: #ef4444;
      background: #fef2f2;
    }

    .answer {
      grid-column: 2 / 4;
      display: none;
      color: #059669;
      font-weight: 700;
      font-size: 15px;
    }

    .print-answer-value {
      display: none;
      margin-left: 4px;
      color: #000000;
      font-weight: 700;
    }

    .show-answer .answer {
      display: block;
    }

    .score-board {
      text-align: center;
      font-size: 20px;
      font-weight: 700;
      color: #2563eb;
      margin-bottom: 18px;
    }

    @media print {
      body {
        background: #ffffff;
        padding: 0;
      }

      .container {
        box-shadow: none;
        border-radius: 0;
        padding: 10mm;
      }

      .settings,
      .actions,
      .message,
      .score-board,
      .answer-input,
      .subtitle {
        display: none !important;
      }

      .problems {
        grid-template-columns: repeat(3, 1fr);
        gap: 8px 16px;
      }

      .problem {
        border: none;
        border-bottom: 1px solid #ddd;
        border-radius: 0;
        padding: 8px 4px;
        background: #ffffff;
        grid-template-columns: 28px 1fr;
      }

      .expression {
        font-size: 18px;
      }

      .answer {
        display: none !important;
      }

      .print-answer-value {
        display: none !important;
      }

      body.print-answers .print-answer-value {
        display: inline !important;
      }

      body.print-answers h1::after {
        content: "（答案）";
      }

      body.print-problems h1::after {
        content: "";
      }

      h1 {
        font-size: 24px;
        margin-bottom: 12px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>计算题</h1>
    <p class="subtitle">自由生成加减乘除练习题</p>

    <div class="settings">
      <div class="field">
        <label for="count">题目数量</label>
        <input id="count" type="number" min="1" max="200" value="30" />
      </div>

      <div class="field">
        <label for="maxNumber">数字范围：多少以内</label>
        <input id="maxNumber" type="number" min="1" max="10000" value="20" />
      </div>

      <div class="field">
        <label for="operandCount">每题数字个数</label>
        <input id="operandCount" type="number" min="2" max="5" value="2" />
      </div>

      <div class="field">
        <label for="carryAdditionPercent">个位进位加法占比至少 %</label>
        <input id="carryAdditionPercent" type="number" min="0" max="100" step="1" value="40" />
      </div>

      <div class="field">
        <label for="borrowSubtractionPercent">借位减法占比至少 %</label>
        <input id="borrowSubtractionPercent" type="number" min="0" max="100" step="1" value="40" />
      </div>

      <div class="field">
        <label>选择运算类型</label>
        <div class="checkbox-group">
          <label class="checkbox-card">
            <input type="checkbox" value="+" checked />
            加法
          </label>
          <label class="checkbox-card">
            <input type="checkbox" value="-" checked />
            减法
          </label>
          <label class="checkbox-card">
            <input type="checkbox" value="×" />
            乘法
          </label>
          <label class="checkbox-card">
            <input type="checkbox" value="÷" />
            除法
          </label>
        </div>
      </div>

      <div class="field">
        <label>
          <input id="noNegative" type="checkbox" checked />
          减法不出现负数
        </label>

        <label>
          <input id="integerDivision" type="checkbox" checked />
          除法只生成整除
        </label>

        <label>
          <input id="limitAllToMax" type="checkbox" checked />
          所有数字和答案都不超过上面的范围
        </label>

        <label>
          <input id="mixedOperations" type="checkbox" />
          每题内混合运算
        </label>

        <label>
          <input id="wordIncludeAnswers" type="checkbox" />
          导出Word时包含答案
        </label>
      </div>

      <div class="field">
        <label>
          <input id="allowSameSubtraction" type="checkbox" />
          减法允许相同数相减
        </label>

        <label>
          <input id="allowAddSubZero" type="checkbox" />
          加减法允许出现 0
        </label>

        <label>
          <input id="allowMultiplicationZero" type="checkbox" />
          乘法允许出现 0
        </label>

        <label>
          <input id="allowMultiplicationOne" type="checkbox" />
          乘法允许出现 1
        </label>

        <label>
          <input id="allowDivisionByOne" type="checkbox" />
          除法分母允许为 1
        </label>

        <label>
          <input id="allowSameDivision" type="checkbox" />
          除法允许相同数相除
        </label>
      </div>
    </div>

    <div class="actions">
      <button class="btn-primary" onclick="generateProblems()">生成题目</button>
      <button class="btn-secondary" onclick="checkAnswers()">自动批改</button>
      <button class="btn-warning" onclick="toggleAnswers()">显示 / 隐藏答案</button>
      <button class="btn-gray" onclick="printProblems()">打印题目</button>
      <button class="btn-gray" onclick="printAnswers()">打印答案</button>
      <button class="btn-gray" onclick="exportWord()">导出Word</button>
    </div>

    <div id="message" class="message"></div>
    <div id="scoreBoard" class="score-board"></div>
    <div id="problems" class="problems"></div>
  </div>

<script>
  const problemsContainer = document.getElementById("problems");
  const messageElement = document.getElementById("message");
  const scoreBoard = document.getElementById("scoreBoard");

  let problems = [];
  let answersVisible = false;

  function randomInt(min, max) {
    min = Math.ceil(min);
    max = Math.floor(max);

    if (max < min) {
      return min;
    }

    return Math.floor(Math.random() * (max - min + 1)) + min;
  }

  function getSelectedOperators() {
    return Array.from(document.querySelectorAll('.checkbox-card input[type="checkbox"]:checked'))
      .map(input => input.value);
  }

  function shouldLimitAllToMax() {
    return document.getElementById("limitAllToMax").checked;
  }

  function isChecked(id) {
    return document.getElementById(id).checked;
  }

  function getOptions() {
    return {
      noNegative: isChecked("noNegative"),
      allowSameSubtraction: isChecked("allowSameSubtraction"),
      allowAddSubZero: isChecked("allowAddSubZero"),
      integerDivision: isChecked("integerDivision"),
      limitAllToMax: isChecked("limitAllToMax"),
      mixedOperations: isChecked("mixedOperations"),
      allowMultiplicationZero: isChecked("allowMultiplicationZero"),
      allowMultiplicationOne: isChecked("allowMultiplicationOne"),
      allowDivisionByOne: isChecked("allowDivisionByOne"),
      allowSameDivision: isChecked("allowSameDivision")
    };
  }

  function setMessage(text, type = "") {
    messageElement.innerHTML = text;
    messageElement.className = `message ${type}`;
  }

  function buildProblem(left, operator, right, answer, allowDecimal = false) {
    const numbers = Array.isArray(left) ? left : [left, right];
    const operators = Array.isArray(operator)
      ? operator
      : Array(Math.max(0, numbers.length - 1)).fill(operator);
    const expression = numbers.reduce((parts, number, index) => {
      if (index > 0) {
        parts.push(operators[index - 1]);
      }

      parts.push(number);
      return parts;
    }, []).join(" ");

    return {
      left: numbers[0],
      operator: operators[0],
      right: numbers[1],
      numbers,
      operators,
      expression: `${expression} =`,
      answer,
      allowDecimal
    };
  }

  function getProblemKey(problem) {
    let numbers = problem.numbers || [problem.left, problem.right];
    const operators = problem.operators || [problem.operator];

    if (operators.every(operator => operator === "+") || operators.every(operator => operator === "×")) {
      numbers = [...numbers].sort((a, b) => a - b);
    }

    return `${operators.join("|")}|${numbers.join("|")}`;
  }

  function addUniqueProblem(list, usedKeys, problem) {
    if (!problem) {
      return false;
    }

    const key = getProblemKey(problem);

    if (usedKeys.has(key)) {
      return false;
    }

    usedKeys.add(key);
    list.push(problem);
    return true;
  }

  function createUniqueProblem(factory, usedKeys, maxAttempts = 10000) {
    for (let i = 0; i < maxAttempts; i++) {
      const problem = factory();

      if (!problem) {
        continue;
      }

      const key = getProblemKey(problem);

      if (!usedKeys.has(key)) {
        return problem;
      }
    }

    return null;
  }

  function isCarryAddition(problem) {
    return problem.operator === "+" && (problem.left % 10) + (problem.right % 10) >= 10;
  }

  function isBorrowSubtraction(problem) {
    return problem.operator === "-" && problem.left >= problem.right && (problem.left % 10) < (problem.right % 10);
  }

  function countCarryAddition(list) {
    return list.filter(isCarryAddition).length;
  }

  function countBorrowSubtraction(list) {
    return list.filter(isBorrowSubtraction).length;
  }

  function getPercentValue(id) {
    const value = Number(document.getElementById(id).value);

    if (!Number.isFinite(value)) {
      return NaN;
    }

    return value;
  }

  function createBySearch(maxNumber, randomFactory, isValid, exhaustiveFactory, maxAttempts = 5000) {
    for (let i = 0; i < maxAttempts; i++) {
      const candidate = randomFactory();

      if (candidate && isValid(candidate.numbers || candidate.left, candidate.right, candidate.answer)) {
        return candidate;
      }
    }

    return exhaustiveFactory();
  }

  function isValidAdditionPair(a, b, maxNumber, options) {
    if (!options.allowAddSubZero && (a === 0 || b === 0)) {
      return false;
    }

    if (options.limitAllToMax && a + b > maxNumber) {
      return false;
    }

    return true;
  }

  function getNumberSearchLimit(operandCount) {
    return operandCount === 2 ? 5000 : 30000;
  }

  function getRandomOperators(selectedOperators, operandCount) {
    return Array.from({ length: operandCount - 1 }, () => {
      return selectedOperators[randomInt(0, selectedOperators.length - 1)];
    });
  }

  function evaluateExpression(numbers, operators, options) {
    let currentTerm = numbers[0];
    let total = 0;

    for (let i = 0; i < operators.length; i++) {
      const operator = operators[i];
      const nextNumber = numbers[i + 1];

      if (operator === "×") {
        currentTerm *= nextNumber;
        continue;
      }

      if (operator === "÷") {
        if (nextNumber === 0) {
          return null;
        }

        if (!options.allowDivisionByOne && nextNumber === 1) {
          return null;
        }

        if (!options.allowSameDivision && currentTerm === nextNumber) {
          return null;
        }

        if (options.integerDivision && currentTerm % nextNumber !== 0) {
          return null;
        }

        currentTerm /= nextNumber;
        continue;
      }

      total += currentTerm;
      currentTerm = operator === "-" ? -nextNumber : nextNumber;
    }

    return total + currentTerm;
  }

  function isValidMixedProblem(numbers, operators, answer, maxNumber, options) {
    if (operators.includes("+") || operators.includes("-")) {
      if (!options.allowAddSubZero && numbers.includes(0)) {
        return false;
      }
    }

    if (operators.includes("-") && options.noNegative && answer < 0) {
      return false;
    }

    if (operators.includes("-") && !options.allowSameSubtraction) {
      for (let i = 0; i < operators.length; i++) {
        if (operators[i] === "-" && numbers[i] === numbers[i + 1]) {
          return false;
        }
      }
    }

    if (operators.includes("×")) {
      if (!options.allowMultiplicationZero && numbers.includes(0)) {
        return false;
      }

      if (!options.allowMultiplicationOne && numbers.includes(1)) {
        return false;
      }
    }

    if (!Number.isFinite(answer)) {
      return false;
    }

    if (options.limitAllToMax && Math.abs(answer) > maxNumber) {
      return false;
    }

    return true;
  }

  function createMixedProblem(maxNumber, operandCount, selectedOperators) {
    const options = getOptions();

    return createBySearch(
      maxNumber,
      () => {
        const numbers = Array.from({ length: operandCount }, () => randomInt(0, maxNumber));
        const operators = getRandomOperators(selectedOperators, operandCount);

        if (new Set(operators).size < 2) {
          return null;
        }

        const rawAnswer = evaluateExpression(numbers, operators, options);

        if (rawAnswer === null) {
          return null;
        }

        const allowDecimal = operators.includes("÷") && !options.integerDivision;
        const answer = allowDecimal ? Number(rawAnswer.toFixed(2)) : rawAnswer;

        if (!isValidMixedProblem(numbers, operators, answer, maxNumber, options)) {
          return null;
        }

        return buildProblem(numbers, operators, null, answer, allowDecimal);
      },
      () => true,
      () => null,
      getNumberSearchLimit(operandCount)
    );
  }

  function createAddition(maxNumber, operandCount = 2) {
    const options = getOptions();

    return createBySearch(
      maxNumber,
      () => {
        const numbers = Array.from({ length: operandCount }, () => randomInt(0, maxNumber));
        const answer = numbers.reduce((total, number) => total + number, 0);
        return buildProblem(numbers, "+", null, answer);
      },
      (a, b, answer) => {
        const numbers = Array.isArray(a) ? a : [a, b];

        if (!options.allowAddSubZero && numbers.includes(0)) {
          return false;
        }

        return !options.limitAllToMax || answer <= maxNumber;
      },
      () => {
        if (operandCount !== 2) {
          return null;
        }

        for (let a = 0; a <= maxNumber; a++) {
          for (let b = 0; b <= maxNumber; b++) {
            if (isValidAdditionPair(a, b, maxNumber, options)) {
              return buildProblem(a, "+", b, a + b);
            }
          }
        }

        return null;
      },
      getNumberSearchLimit(operandCount)
    );
  }

  function createCarryAddition(maxNumber, operandCount = 2) {
    const options = getOptions();

    return createBySearch(
      maxNumber,
      () => {
        const numbers = Array.from({ length: operandCount }, () => randomInt(0, maxNumber));
        const answer = numbers.reduce((total, number) => total + number, 0);
        return buildProblem(numbers, "+", null, answer);
      },
      (a, b, answer) => {
        const numbers = Array.isArray(a) ? a : [a, b];

        if (!options.allowAddSubZero && numbers.includes(0)) {
          return false;
        }

        if (options.limitAllToMax && answer > maxNumber) {
          return false;
        }

        return (numbers[0] % 10) + (numbers[1] % 10) >= 10;
      },
      () => {
        if (operandCount !== 2) {
          return null;
        }

        for (let a = 0; a <= maxNumber; a++) {
          for (let b = 0; b <= maxNumber; b++) {
            if (isValidAdditionPair(a, b, maxNumber, options) && (a % 10) + (b % 10) >= 10) {
              return buildProblem(a, "+", b, a + b);
            }
          }
        }

        return null;
      },
      getNumberSearchLimit(operandCount)
    );
  }

  function isValidSubtractionPair(a, b, maxNumber, options) {
    if (!options.allowAddSubZero && (a === 0 || b === 0)) {
      return false;
    }

    if (options.noNegative && a < b) {
      return false;
    }

    if (!options.allowSameSubtraction && a === b) {
      return false;
    }

    return true;
  }

  function createSubtraction(maxNumber, operandCount = 2) {
    const options = getOptions();

    return createBySearch(
      maxNumber,
      () => {
        const numbers = Array.from({ length: operandCount }, () => randomInt(0, maxNumber));
        const answer = numbers.slice(1).reduce((total, number) => total - number, numbers[0]);
        return buildProblem(numbers, "-", null, answer);
      },
      (a, b, answer) => {
        const numbers = Array.isArray(a) ? a : [a, b];

        if (!options.allowAddSubZero && numbers.includes(0)) {
          return false;
        }

        if (options.noNegative && answer < 0) {
          return false;
        }

        if (!options.allowSameSubtraction && numbers.slice(1).includes(numbers[0])) {
          return false;
        }

        return true;
      },
      () => {
        if (operandCount !== 2) {
          return null;
        }

        for (let a = 0; a <= maxNumber; a++) {
          for (let b = 0; b <= maxNumber; b++) {
            if (isValidSubtractionPair(a, b, maxNumber, options)) {
              return buildProblem(a, "-", b, a - b);
            }
          }
        }

        return null;
      },
      getNumberSearchLimit(operandCount)
    );
  }

  function createBorrowSubtraction(maxNumber, operandCount = 2) {
    const options = getOptions();

    return createBySearch(
      maxNumber,
      () => {
        const numbers = Array.from({ length: operandCount }, () => randomInt(0, maxNumber));
        const answer = numbers.slice(1).reduce((total, number) => total - number, numbers[0]);
        return buildProblem(numbers, "-", null, answer);
      },
      (a, b, answer) => {
        const numbers = Array.isArray(a) ? a : [a, b];

        if (!options.allowAddSubZero && numbers.includes(0)) {
          return false;
        }

        if (options.noNegative && answer < 0) {
          return false;
        }

        if (!options.allowSameSubtraction && numbers.slice(1).includes(numbers[0])) {
          return false;
        }

        return numbers[0] >= numbers[1] && (numbers[0] % 10) < (numbers[1] % 10);
      },
      () => {
        if (operandCount !== 2) {
          return null;
        }

        for (let a = 0; a <= maxNumber; a++) {
          for (let b = 0; b <= maxNumber; b++) {
            if (isValidSubtractionPair(a, b, maxNumber, options) && a >= b && (a % 10) < (b % 10)) {
              return buildProblem(a, "-", b, a - b);
            }
          }
        }

        return null;
      },
      getNumberSearchLimit(operandCount)
    );
  }

  function isValidMultiplicationPair(a, b, maxNumber, options) {
    if (!options.allowMultiplicationZero && (a === 0 || b === 0)) {
      return false;
    }

    if (!options.allowMultiplicationOne && (a === 1 || b === 1)) {
      return false;
    }

    if (options.limitAllToMax && a * b > maxNumber) {
      return false;
    }

    return true;
  }

  function createMultiplication(maxNumber, operandCount = 2) {
    const options = getOptions();

    return createBySearch(
      maxNumber,
      () => {
        const numbers = Array.from({ length: operandCount }, () => randomInt(0, maxNumber));
        const answer = numbers.reduce((total, number) => total * number, 1);
        return buildProblem(numbers, "×", null, answer);
      },
      (a, b, answer) => {
        const numbers = Array.isArray(a) ? a : [a, b];

        if (!options.allowMultiplicationZero && numbers.includes(0)) {
          return false;
        }

        if (!options.allowMultiplicationOne && numbers.includes(1)) {
          return false;
        }

        return !options.limitAllToMax || answer <= maxNumber;
      },
      () => {
        if (operandCount !== 2) {
          return null;
        }

        for (let a = 0; a <= maxNumber; a++) {
          for (let b = 0; b <= maxNumber; b++) {
            if (isValidMultiplicationPair(a, b, maxNumber, options)) {
              return buildProblem(a, "×", b, a * b);
            }
          }
        }

        return null;
      },
      getNumberSearchLimit(operandCount)
    );
  }

  function isValidDivisionPair(dividend, divisor, maxNumber, options) {
    if (divisor === 0) {
      return false;
    }

    if (!options.allowDivisionByOne && divisor === 1) {
      return false;
    }

    if (!options.allowSameDivision && dividend === divisor) {
      return false;
    }

    if (options.integerDivision && dividend % divisor !== 0) {
      return false;
    }

    const answer = dividend / divisor;

    if (!Number.isFinite(answer)) {
      return false;
    }

    if (options.limitAllToMax && Math.abs(answer) > maxNumber) {
      return false;
    }

    return true;
  }

  function createDivision(maxNumber, operandCount = 2) {
    const options = getOptions();

    return createBySearch(
      maxNumber,
      () => {
        const numbers = [randomInt(0, maxNumber)];

        for (let i = 1; i < operandCount; i++) {
          numbers.push(randomInt(1, maxNumber));
        }

        const rawAnswer = numbers.slice(1).reduce((total, number) => total / number, numbers[0]);
        const answer = options.integerDivision ? rawAnswer : Number(rawAnswer.toFixed(2));

        return buildProblem(numbers, "÷", null, answer, !options.integerDivision);
      },
      (dividend, divisor, answer) => {
        const numbers = Array.isArray(dividend) ? dividend : [dividend, divisor];
        let result = numbers[0];

        for (let i = 1; i < numbers.length; i++) {
          const currentDivisor = numbers[i];

          if (currentDivisor === 0) {
            return false;
          }

          if (!options.allowDivisionByOne && currentDivisor === 1) {
            return false;
          }

          if (!options.allowSameDivision && result === currentDivisor) {
            return false;
          }

          if (options.integerDivision && result % currentDivisor !== 0) {
            return false;
          }

          result /= currentDivisor;
        }

        if (!Number.isFinite(answer)) {
          return false;
        }

        return !options.limitAllToMax || Math.abs(answer) <= maxNumber;
      },
      () => {
        if (operandCount !== 2) {
          return null;
        }

        for (let dividend = 0; dividend <= maxNumber; dividend++) {
          for (let divisor = 1; divisor <= maxNumber; divisor++) {
            if (isValidDivisionPair(dividend, divisor, maxNumber, options)) {
              const rawAnswer = dividend / divisor;
              const answer = options.integerDivision ? rawAnswer : Number(rawAnswer.toFixed(2));

              return buildProblem(dividend, "÷", divisor, answer, !options.integerDivision);
            }
          }
        }

        return null;
      },
      getNumberSearchLimit(operandCount)
    );
  }

  function createProblem(operator, maxNumber, operandCount = 2) {
    switch (operator) {
      case "+":
        return createAddition(maxNumber, operandCount);
      case "-":
        return createSubtraction(maxNumber, operandCount);
      case "×":
        return createMultiplication(maxNumber, operandCount);
      case "÷":
        return createDivision(maxNumber, operandCount);
      default:
        return createAddition(maxNumber, operandCount);
    }
  }

  function canCreateOperator(operator, maxNumber, operandCount) {
    return createProblem(operator, maxNumber, operandCount) !== null;
  }

  function shuffleProblems(list) {
    for (let i = list.length - 1; i > 0; i--) {
      const j = randomInt(0, i);
      [list[i], list[j]] = [list[j], list[i]];
    }
  }

  function generateRequiredUniqueProblems({
    targetCount,
    currentList,
    usedKeys,
    factory,
    countFn,
    errorMessage,
    maxNumber,
    operandCount
  }) {
    let attempts = 0;
    const maxAttempts = Math.max(20000, targetCount * 2000);

    while (countFn(currentList) < targetCount && attempts < maxAttempts) {
      attempts++;

      const problem = createUniqueProblem(() => factory(maxNumber, operandCount), usedKeys, 200);

      if (problem) {
        addUniqueProblem(currentList, usedKeys, problem);
      }
    }

    if (countFn(currentList) < targetCount) {
      setMessage(errorMessage, "error");
      return false;
    }

    return true;
  }

  function generateProblems() {
    const count = Number(document.getElementById("count").value);
    const maxNumber = Number(document.getElementById("maxNumber").value);
    const operandCount = Number(document.getElementById("operandCount").value);
    const operators = getSelectedOperators();
    const mixedOperations = isChecked("mixedOperations");
    const carryAdditionPercent = getPercentValue("carryAdditionPercent");
    const borrowSubtractionPercent = getPercentValue("borrowSubtractionPercent");

    problems = [];
    answersVisible = false;
    scoreBoard.textContent = "";
    problemsContainer.classList.remove("show-answer");

    if (!Number.isInteger(count) || count < 1 || count > 200) {
      setMessage("题目数量请输入 1 到 200 之间的整数。", "error");
      return;
    }

    if (!Number.isInteger(maxNumber) || maxNumber < 1 || maxNumber > 10000) {
      setMessage("数字范围请输入 1 到 10000 之间的整数。", "error");
      return;
    }

    if (!Number.isInteger(operandCount) || operandCount < 2 || operandCount > 5) {
      setMessage("每题数字个数请输入 2 到 5 之间的整数。", "error");
      return;
    }

    if (operators.length === 0) {
      setMessage("请至少选择一种运算类型。", "error");
      return;
    }

    if (mixedOperations && operators.length < 2) {
      setMessage("开启每题内混合运算时，请至少选择两种运算类型。", "error");
      return;
    }

    if (mixedOperations && operandCount < 3) {
      setMessage("开启每题内混合运算时，每题数字个数至少要设置为 3。", "error");
      return;
    }

    if (!Number.isFinite(carryAdditionPercent) || carryAdditionPercent < 0 || carryAdditionPercent > 100) {
      setMessage("个位进位加法占比请输入 0 到 100 之间的数字。", "error");
      return;
    }

    if (!Number.isFinite(borrowSubtractionPercent) || borrowSubtractionPercent < 0 || borrowSubtractionPercent > 100) {
      setMessage("借位减法占比请输入 0 到 100 之间的数字。", "error");
      return;
    }

    if (!mixedOperations && carryAdditionPercent > 0 && !operators.includes("+")) {
      setMessage("设置了个位进位加法占比时，必须勾选“加法”。", "error");
      return;
    }

    if (!mixedOperations && borrowSubtractionPercent > 0 && !operators.includes("-")) {
      setMessage("设置了借位减法占比时，必须勾选“减法”。", "error");
      return;
    }

    const requiredCarryAdditionCount = mixedOperations ? 0 : Math.ceil(count * carryAdditionPercent / 100);
    const requiredBorrowSubtractionCount = mixedOperations ? 0 : Math.ceil(count * borrowSubtractionPercent / 100);

    if (requiredCarryAdditionCount + requiredBorrowSubtractionCount > count) {
      setMessage("个位进位加法和借位减法的占比合计不能超过 100%。", "error");
      return;
    }

    if (requiredCarryAdditionCount > 0 && createCarryAddition(maxNumber, operandCount) === null) {
      setMessage("当前设置下无法生成个位进位加法，请调整数字范围或允许加减法出现 0。", "error");
      return;
    }

    if (requiredBorrowSubtractionCount > 0 && createBorrowSubtraction(maxNumber, operandCount) === null) {
      setMessage("当前设置下无法生成借位减法，请调整数字范围、减法设置或允许加减法出现 0。", "error");
      return;
    }

    let availableOperators = operators.filter(operator => canCreateOperator(operator, maxNumber, operandCount));

    if (mixedOperations) {
      const mixedProblem = createMixedProblem(maxNumber, operandCount, operators);
      availableOperators = mixedProblem ? operators : [];
    }

    if (availableOperators.length === 0) {
      setMessage("当前设置下无法生成题目，请放宽限制条件。", "error");
      return;
    }

    const usedKeys = new Set();

    const carryOk = generateRequiredUniqueProblems({
      targetCount: requiredCarryAdditionCount,
      currentList: problems,
      usedKeys,
      factory: createCarryAddition,
      countFn: countCarryAddition,
      errorMessage: "当前设置下，能生成的不重复个位进位加法题不够。请减少题目数量、降低占比，或放宽数字范围。",
      maxNumber,
      operandCount
    });

    if (!carryOk) {
      problems = [];
      renderProblems();
      return;
    }

    const borrowOk = generateRequiredUniqueProblems({
      targetCount: requiredBorrowSubtractionCount,
      currentList: problems,
      usedKeys,
      factory: createBorrowSubtraction,
      countFn: countBorrowSubtraction,
      errorMessage: "当前设置下，能生成的不重复借位减法题不够。请减少题目数量、降低占比，或放宽数字范围。",
      maxNumber,
      operandCount
    });

    if (!borrowOk) {
      problems = [];
      renderProblems();
      return;
    }

    let fillAttempts = 0;
    const maxFillAttempts = Math.max(50000, count * 3000);

    while (problems.length < count && fillAttempts < maxFillAttempts) {
      fillAttempts++;

      const problem = mixedOperations
        ? createUniqueProblem(() => createMixedProblem(maxNumber, operandCount, availableOperators), usedKeys, getNumberSearchLimit(operandCount))
        : (() => {
            const operator = availableOperators[randomInt(0, availableOperators.length - 1)];
            return createUniqueProblem(() => createProblem(operator, maxNumber, operandCount), usedKeys, getNumberSearchLimit(operandCount));
          })();

      if (problem) {
        addUniqueProblem(problems, usedKeys, problem);
      }
    }

    if (problems.length < count) {
      const generatedCount = problems.length;
      problems = [];
      renderProblems();

      setMessage(
        `当前限制条件下，不重复题目数量不够。最多只尝试生成到 ${generatedCount} 道。<br>
        请减少题目数量、调大数字范围，或放宽 0、1、相同数、整除等限制。`,
        "error"
      );
      return;
    }

    shuffleProblems(problems);
    renderProblems();

    const actualCarryAdditionCount = countCarryAddition(problems);
    const actualBorrowSubtractionCount = countBorrowSubtraction(problems);

    const actualCarryAdditionPercent = Math.round((actualCarryAdditionCount / count) * 100);
    const actualBorrowSubtractionPercent = Math.round((actualBorrowSubtractionCount / count) * 100);

    const limitText = shouldLimitAllToMax()
      ? "，所有数字和答案都不会超过设置范围"
      : "";
    const operationModeText = mixedOperations ? "，每题内混合运算" : "，每题内相同运算";

    setMessage(
      `已生成 ${count} 道不重复题${limitText}${operationModeText}。<br>
      个位进位加法：${actualCarryAdditionCount} 道，约 ${actualCarryAdditionPercent}%；
      借位减法：${actualBorrowSubtractionCount} 道，约 ${actualBorrowSubtractionPercent}%。`,
      "success"
    );
  }

  function renderProblems() {
    problemsContainer.innerHTML = "";

    const columns = 3;
    const total = problems.length;
    const rows = Math.ceil(total / columns);

    for (let row = 0; row < rows; row++) {
      for (let col = 0; col < columns; col++) {
        const problemIndex = col * rows + row;

        if (problemIndex >= total) {
          continue;
        }

        const problem = problems[problemIndex];
        const problemElement = document.createElement("div");

        problemElement.className = "problem";

        problemElement.innerHTML = `
          <div class="problem-number">${problemIndex + 1}.</div>
          <div class="expression">
            ${problem.expression}
            <span class="print-answer-value">${problem.answer}</span>
          </div>
          <input 
            class="answer-input" 
            type="number" 
            step="any"
            data-index="${problemIndex}" 
            placeholder="答案" 
          />
          <div class="answer">答案：${problem.answer}</div>
        `;

        problemsContainer.appendChild(problemElement);
      }
    }
  }

  function checkAnswers() {
    if (problems.length === 0) {
      setMessage("请先生成题目。", "error");
      return;
    }

    const inputs = document.querySelectorAll(".answer-input");
    let correctCount = 0;

    inputs.forEach(input => {
      const index = Number(input.dataset.index);
      const userAnswer = Number(input.value);
      const correctAnswer = problems[index].answer;

      input.classList.remove("correct", "wrong");

      if (input.value.trim() === "") {
        input.classList.add("wrong");
        return;
      }

      const isCorrect = Math.abs(userAnswer - correctAnswer) < 0.001;

      if (isCorrect) {
        input.classList.add("correct");
        correctCount++;
      } else {
        input.classList.add("wrong");
      }
    });

    const total = problems.length;
    const score = Math.round((correctCount / total) * 100);

    scoreBoard.textContent = `得分：${score} 分，答对 ${correctCount} / ${total} 题`;
    setMessage("批改完成。绿色表示正确，红色表示错误。", "success");
  }

  function toggleAnswers() {
    if (problems.length === 0) {
      setMessage("请先生成题目。", "error");
      return;
    }

    answersVisible = !answersVisible;
    problemsContainer.classList.toggle("show-answer", answersVisible);

    setMessage(answersVisible ? "答案已显示。" : "答案已隐藏。", "success");
  }

  function clearPrintMode() {
    document.body.classList.remove("print-problems", "print-answers");
  }

  function setPrintMode(mode) {
    clearPrintMode();
    document.body.classList.add(mode);
  }

  function printProblems() {
    if (problems.length === 0) {
      setMessage("请先生成题目。", "error");
      return;
    }

    setPrintMode("print-problems");
    window.print();
  }

  function printAnswers() {
    if (problems.length === 0) {
      setMessage("请先生成题目。", "error");
      return;
    }

    setPrintMode("print-answers");
    window.print();
  }

  window.addEventListener("afterprint", clearPrintMode);

  function escapeHtml(value) {
    return String(value)
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");
  }

  function getDateText() {
    const now = new Date();
    const year = now.getFullYear();
    const month = String(now.getMonth() + 1).padStart(2, "0");
    const day = String(now.getDate()).padStart(2, "0");

    return `${year}-${month}-${day}`;
  }

  function buildWordProblemTable() {
    const columns = 3;
    const total = problems.length;
    const rows = Math.ceil(total / columns);
    let html = "";

    for (let row = 0; row < rows; row++) {
      html += "<tr>";

      for (let col = 0; col < columns; col++) {
        const index = col * rows + row;
        const problem = problems[index];

        if (!problem) {
          html += "<td>&nbsp;</td>";
          continue;
        }

        html += `
          <td>
            <span class="problem-number">${index + 1}.</span>
            <span class="expression">${escapeHtml(problem.expression)}</span>
            <span class="answer-line"></span>
          </td>
        `;
      }

      html += "</tr>";
    }

    return html;
  }

  function buildWordAnswerTable() {
    const columns = 3;
    const total = problems.length;
    const rows = Math.ceil(total / columns);
    let html = "";

    for (let row = 0; row < rows; row++) {
      html += "<tr>";

      for (let col = 0; col < columns; col++) {
        const index = col * rows + row;
        const problem = problems[index];

        if (!problem) {
          html += "<td>&nbsp;</td>";
          continue;
        }

        html += `
          <td>
            <span class="problem-number">${index + 1}.</span>
            <span class="expression">${escapeHtml(problem.expression)} ${escapeHtml(problem.answer)}</span>
          </td>
        `;
      }

      html += "</tr>";
    }

    return html;
  }

  function exportWord() {
    if (problems.length === 0) {
      setMessage("请先生成题目。", "error");
      return;
    }

    const maxNumber = document.getElementById("maxNumber").value;
    const count = problems.length;
    const includeAnswers = document.getElementById("wordIncludeAnswers").checked;
    const dateText = getDateText();
    const title = `${maxNumber}以内计算题`;
    const fileName = `${title}-${count}道-${dateText}.doc`;

    const answerSection = includeAnswers
      ? `
        <div class="page-break"></div>
        <h1>答案</h1>
        <table class="answer-table">
          ${buildWordAnswerTable()}
        </table>
      `
      : "";

    const wordHtml = `
      <!DOCTYPE html>
      <html lang="zh-CN">
      <head>
        <meta charset="UTF-8" />
        <title>${escapeHtml(title)}</title>
        <style>
          @page {
            size: A4;
            margin: 14mm 12mm;
          }

          body {
            font-family: "Microsoft YaHei", SimSun, Arial, sans-serif;
            color: #000000;
            font-size: 14pt;
          }

          h1 {
            text-align: center;
            font-size: 22pt;
            margin: 0 0 12pt 0;
          }

          .info {
            width: 100%;
            margin-bottom: 12pt;
            font-size: 12pt;
          }

          .info td {
            border: none;
            padding: 4pt 0;
          }

          table {
            border-collapse: collapse;
            width: 100%;
          }

          .problem-table td {
            width: 33.33%;
            height: 30pt;
            padding: 5pt 6pt;
            vertical-align: middle;
            border-bottom: 1px solid #cccccc;
            white-space: nowrap;
          }

          .problem-number {
            display: inline-block;
            width: 24pt;
            font-weight: bold;
          }

          .expression {
            font-weight: bold;
          }

          .answer-line {
            display: inline-block;
            width: 42pt;
            border-bottom: 1px solid #000000;
            margin-left: 6pt;
          }

          .answer-table td {
            width: 16.66%;
            padding: 6pt;
            border-bottom: 1px solid #cccccc;
            font-size: 12pt;
          }

          .page-break {
            page-break-before: always;
          }
        </style>
      </head>
      <body>
        <h1>${escapeHtml(title)}</h1>

        <table class="info">
          <tr>
            <td>姓名：____________</td>
            <td>日期：____________</td>
            <td>用时：____________</td>
            <td>得分：____________</td>
          </tr>
        </table>

        <table class="problem-table">
          ${buildWordProblemTable()}
        </table>

        ${answerSection}
      </body>
      </html>
    `;

    const blob = new Blob(["\ufeff", wordHtml], {
      type: "application/msword;charset=utf-8"
    });

    const url = URL.createObjectURL(blob);
    const link = document.createElement("a");

    link.href = url;
    link.download = fileName;
    document.body.appendChild(link);
    link.click();

    document.body.removeChild(link);
    URL.revokeObjectURL(url);

    setMessage(`已导出 Word 文件：${fileName}`, "success");
  }

  generateProblems();
</script>

</body>
</html>
